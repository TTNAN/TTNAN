<svg xmlns="http://www.w3.org/2000/svg" width="540" height="70" viewBox="0 0 540 70">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7b1e"/>
      <stop offset="0.30" stop-color="#d4af37"/>
      <stop offset="0.50" stop-color="#fff3b0"/>
      <stop offset="0.70" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9a7b1e"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.55 0; 0.55 0; -0.55 0" keyTimes="0; 0.5; 1"
        dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="270" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="url(#gold)" textLength="500" lengthAdjust="spacingAndGlyphs">Fortune favors the bold.</text>
</svg>
